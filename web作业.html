<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>梦幻旅行</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0f8ff;
            color: #333;
            text-align: center;
        }

        header {
            background: linear-gradient(135deg, #56ccf2, #2f80ed);
            color: white;
            padding: 35px 15px;
        }

        nav {
            background: white;
            padding: 15px;
        }

        nav a {
            text-decoration: none;
            color: #2878c8;
            margin: 15px;
        }

        h2 {
            color: #2878c8;
        }

        .container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 25px;
            padding: 25px;
        }

        .card {
            background: white;
            width: 250px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 12px #ddd;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-8px);
        }

        .card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }

        .card p {
            color: #777;
            padding: 0 15px;
            line-height: 1.6;
        }

        button {
            background: #2f80ed;
            color: white;
            border: none;
            padding: 10px 22px;
            margin: 15px;
            border-radius: 20px;
            cursor: pointer;
        }

        button:hover {
            background: #155ab6;
        }

        footer {
            background: #d9efff;
            padding: 20px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <header id="home">
        <h1>🌍 梦幻旅行</h1>
        <p>世界很大，一起去看看！</p >
    </header>

    <nav>
        <a href=" ">首页</a >
        <a href="#places">旅行目的地</a >
        <a href="#about">关于我们</a >
    </nav>

    <h2 id="places">✈️ 热门旅行地</h2>
    <p>选择一个目的地，开启你的旅行梦想。</p >

    <div class="container">

        <div class="card">
                        <h3>🗼 日本东京</h3>
            <p>感受繁华都市，探索美食与动漫文化。</p >
            <button onclick="travel('日本东京')">了解更多</button>
        </div>

        <div class="card">
                       <h3>🗼 法国巴黎</h3>
            <p>欣赏浪漫风景，体验艺术与时尚。</p >
            <button onclick="travel('法国巴黎')">了解更多</button>
        </div>

        <div class="card">
                       <h3>🏖️ 阳光海岛</h3>
            <p>享受蓝天大海，度过悠闲假期。</p >
            <button onclick="travel('阳光海岛')">了解更多</button>
        </div>

    </div>

    <div id="about">
        <h2>关于我们</h2>
        <p>旅行让生活更加精彩，让我们发现世界的美好。</p >
    </div>

    <footer>
        <p>© 2026 梦幻旅行 | Web 课堂作业</p >
    </footer>

    <script>
        function travel(place) {
            alert("欢迎探索：" + place + "！祝你旅途愉快！");
        }
    </script>

</body>
</html>
